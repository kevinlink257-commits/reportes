name: Backend PostGIS integration tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-integration.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-integration.yml"

permissions:
  contents: read

jobs:
  postgis-integration:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: colserlog_test
          POSTGRES_USER: colserlog
          POSTGRES_PASSWORD: colserlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U colserlog -d colserlog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://colserlog:colserlog@localhost:5432/colserlog_test
      DEV_AUTH: "false"
      OIDC_JWKS_URL: "ci-not-used"
      OIDC_ISSUER: "ci-not-used"
      OIDC_AUDIENCE: "ci-not-used"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
        working-directory: .

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply schema and performance indexes
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/001_init.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/002_performance_indexes.sql

      - name: Run PostGIS integration tests
        run: python -m pytest -q tests/integration -m integration
